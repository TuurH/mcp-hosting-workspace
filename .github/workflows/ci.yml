name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt
      - name: Check documentation links and script references
        run: python scripts/check-docs.py
      - name: Run unit tests
        run: python -m pytest -q tests

  platform-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build platform image
        run: docker build -t mcp-hosting-workspace/platform:local platform
      - name: Files container integration test
        run: tests/integration/files_container.sh mcp-hosting-workspace/platform:local
      - name: Platform stack integration test (deployer, Pomerium, static, admin)
        run: |
          docker pull moby/buildkit:v0.35.0-rootless
          # CI host prerequisite for isolated rootless user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          tests/integration/platform_stack.sh mcp-hosting-workspace/platform:local
      - name: Render owner pages and check desktop/mobile layout
        if: always()
        run: |
          # Create the output directory as the runner so Playwright can write screenshots.
          mkdir -p ui-artifacts
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo mcp-hosting-workspace/platform:local python tests/integration/render_admin.py ui-artifacts
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node tests/integration/admin_layout.cjs
          node tests/integration/admin_live.cjs
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-${{ github.event_name }}
          path: ui-artifacts/*.png
      - name: Gaming mode GPU reaper integration test
        run: tests/integration/gpu_reaper.sh mcp-hosting-workspace/platform:local
      - name: Validate compose files
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.local.yaml config --quiet

  powershell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every PowerShell script (PowerShell 7)
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($failed) { exit 1 }
      - name: Helper tests (PowerShell 7)
        shell: pwsh
        run: ./tests/powershell/test-common.ps1
      - name: Fresh-install setup tests (PowerShell 7)
        shell: pwsh
        run: ./tests/powershell/test-setup.ps1

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every PowerShell script (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($failed) { exit 1 }
      - name: Helper tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\powershell\test-common.ps1
      - name: Fresh-install setup tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\powershell\test-setup.ps1
